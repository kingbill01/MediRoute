# Render Blueprint — déploiement automatique du backend MediRoute
# Doc : https://render.com/docs/blueprint-spec
#
# Stratégie : backend sur Render (gratuit, sans CB),
# BDD PostgreSQL externe sur Neon (gratuit à vie, vs Render qui expire à 90j)

services:
  - type: web
    name: mediroute-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false  # ← à coller manuellement (URL Neon)
      - key: JWT_SECRET
        sync: false  # ← à coller manuellement (générer avec openssl rand -base64 48)
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://mediroute.qzz.io,https://mediroute.pages.dev,http://localhost:3003
      - key: ANTHROPIC_API_KEY
        sync: false  # optionnel — laisser vide pour utiliser le mode dégradé
